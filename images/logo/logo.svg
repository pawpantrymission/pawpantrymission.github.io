<?xml version="1.0" encoding="UTF-8"?>
<svg width="240px" height="64px" viewBox="0 0 240 64" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Paw Pantry Mission Logo</title>
    <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="logo" fill="#ff8c00">
            <!-- Paw print icon -->
            <g transform="translate(10, 16)">
                <ellipse cx="8" cy="12" rx="4" ry="6"/>
                <ellipse cx="16" cy="8" rx="3" ry="5"/>
                <ellipse cx="24" cy="8" rx="3" ry="5"/>
                <ellipse cx="32" cy="12" rx="4" ry="6"/>
                <ellipse cx="20" cy="20" rx="6" ry="8"/>
            </g>
            <!-- Text -->
            <text x="55" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2f2f41">
                Paw Pantry Mission
            </text>
            <text x="55" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">
                Helping Pets &amp; Families Stay Together
            </text>
        </g>
    </g>
</svg>