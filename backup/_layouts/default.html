<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }} - {% endif %}Paw Pantry Mission - Helping Pets and Families in Need</title>
    <meta name="description" content="Paw Pantry Mission provides pet food assistance and resources to families in need, ensuring no pet goes hungry.">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ 'css/all.min.css' }}">
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body, html {
        font-family: 'Poppins', sans-serif;
        color: #474747;
        line-height: 1.6;
      }
      
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }
      
      /* Header */
      header {
        background-color: #ff8c00;
        color: white;
        padding: 1rem 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      
      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      
      .logo h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 0;
      }
      
      nav ul {
        list-style: none;
        display: flex;
        gap: 2rem;
        margin: 0;
      }
      
      nav a {
        color: white;
        text-decoration: none;
        font-weight: 400;
        transition: opacity 0.3s;
      }
      
      nav a:hover {
        opacity: 0.8;
      }
      
      /* Main content */
      main {
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
      }
      
      /* Hero section */
      .hero {
        text-align: center;
        padding: 3rem 0;
        background: linear-gradient(135deg, #fff5e6 0%, #ffffff 100%);
      }
      
      .hero h1 {
        font-size: 2.5rem;
        color: #ff8c00;
        margin-bottom: 1rem;
        font-weight: 700;
      }
      
      .hero p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      
      /* Buttons */
      .btn {
        display: inline-block;
        padding: 12px 30px;
        background-color: #ff8c00;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: 600;
        transition: background-color 0.3s;
        margin: 0 10px;
      }
      
      .btn:hover {
        background-color: #e67c00;
      }
      
      .btn-secondary {
        background-color: transparent;
        color: #ff8c00;
        border: 2px solid #ff8c00;
      }
      
      .btn-secondary:hover {
        background-color: #ff8c00;
        color: white;
      }
      
      /* Sections */
      section {
        padding: 3rem 0;
      }
      
      .section-title {
        text-align: center;
        font-size: 2rem;
        color: #ff8c00;
        margin-bottom: 2rem;
        font-weight: 600;
      }
      
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
      }
      
      .card {
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
      }
      
      .card h3 {
        color: #ff8c00;
        margin-bottom: 1rem;
        font-weight: 600;
      }
      
      .card .icon {
        font-size: 3rem;
        color: #ff8c00;
        margin-bottom: 1rem;
      }
      
      /* Footer */
      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 2rem 0;
      }
      
      .social-links {
        margin: 1rem 0;
      }
      
      .social-links a {
        color: #ff8c00;
        font-size: 1.5rem;
        margin: 0 10px;
        transition: color 0.3s;
      }
      
      .social-links a:hover {
        color: white;
      }
      
      /* Responsive */
      @media (max-width: 768px) {
        .header-content {
          flex-direction: column;
          gap: 1rem;
        }
        
        nav ul {
          gap: 1rem;
        }
        
        .hero h1 {
          font-size: 2rem;
        }
        
        .hero p {
          font-size: 1rem;
        }
        
        .btn {
          display: block;
          margin: 10px auto;
          max-width: 200px;
        }
      }
    </style>

  </head>

  <body>
    <header>
      <div class="container">
        <div class="header-content">
          <div class="logo">
            <h1>Paw Pantry Mission</h1>
          </div>
          <nav>
            <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/about">About</a></li>
              <li><a href="/programs">Programs</a></li>
              <li><a href="/help">How to Help</a></li>
              <li><a href="/donation">Donate</a></li>
              <li><a href="/contact">Contact</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main>
      {{ content }} 
    </main>

    <footer>
      <div class="container">
        <div class="social-links">
          <a href="https://www.facebook.com/pawpantrymission" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="https://www.instagram.com/pawpantrymission/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="mailto:hello@pawpantrymission.org" aria-label="Email"><i class="far fa-envelope"></i></a>
        </div>
        <p>&copy; 2024 Paw Pantry Mission. All rights reserved.</p>
        <p>Helping pets and families in need - because every pet deserves love and care.</p>
      </div>
    </footer>

    {% if site.google_analytics %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
  </body>
</html>
